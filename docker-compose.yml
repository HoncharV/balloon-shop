# ============================================================================
# Balloon Magic — локальний стек
#
# Типове використання (лише база, застосунок запускається через `npm run dev`):
#     docker compose up -d db
#
# Повний стек у контейнерах:
#     docker compose --profile full up -d --build
#
# Профіль "full" навмисно вимкнений типово, щоб `docker compose up -d db`
# не збирав образ застосунку (на слабких машинах це дорого).
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: balloon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: balloon
      POSTGRES_PASSWORD: balloon
      POSTGRES_DB: balloon_magic
      # Прискорює ініціалізацію на повільних дисках
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - balloon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balloon -d balloon_magic"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    profiles: ["full"]
    build:
      context: .
      args:
        DATABASE_URL: postgresql://balloon:balloon@db:5432/balloon_magic?schema=public
    container_name: balloon-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Межі «сьогодні» в аналітиці рахуються в цьому поясі
      TZ: Europe/Kyiv
      DATABASE_URL: postgresql://balloon:balloon@db:5432/balloon_magic?schema=public
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET обов'язковий — задайте його у .env}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      # Фото, завантажені через /admin/gallery, переживають перезбірку образу
      - balloon-uploads:/app/public/uploads

volumes:
  balloon-db-data:
  balloon-uploads:
